name = "netflixarin-notify"
main = "src/index.js"
compatibility_date = "2025-11-01"

# Cron tiap 1 menit (gratis; minimum interval Cloudflare). Notif langganan habis
# maksimal telat ~1 menit. Worker menulis KV hemat (lihat src/index.js).
[triggers]
crons = ["* * * * *"]

# ID namespace diisi setelah: npx wrangler kv namespace create NOTIFY_KV
[[kv_namespaces]]
binding = "NOTIFY_KV"
id = "7c4a856c41f8454f8308d6fe35049fad"
